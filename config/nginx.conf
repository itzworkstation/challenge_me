upstream app {
  # Path to Puma SOCK file, as defined previously
  server unix:/home/deploy/challenge_me_dev/shared/tmp/sockets/puma.sock fail_timeout=0;
}

server {
  listen 80 default_server deferred;
  server_name localhost;

  root /home/deploy/challenge_me_dev/current/public;
  access_log /home/deploy/challenge_me_dev/current/log/nginx.access.log;
  error_log /home/deploy/challenge_me_dev/current/log/nginx.error.log info;

  try_files $uri/index.html $uri @app;

  location @app {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    
    proxy_pass http://app;
  }

  location ~ ^/(assets|fonts|system)/|favicon.ico|robots.txt {
    gzip_static on;
    expires max;
    add_header Cache-Control public;
  }

  error_page 500 502 503 504 /500.html;
  client_max_body_size 4G;
  keepalive_timeout 10;
}
